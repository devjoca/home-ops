[package]
name = "lg-home-redirect-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
futures-util = { version = "0.3", features = ["sink"] }
native-tls = { version = "0.2", features = ["vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "net", "time", "signal"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
